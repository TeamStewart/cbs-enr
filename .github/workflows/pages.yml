# Render the dashboard against the committed test data and deploy to GitHub Pages.
# Data: data/dashboard/dashtest_data.rds (written by scripts/util/make_dashboard_test_data.R)
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - index.qmd
      - custom.scss
      - cbs_white.svg
      - data/dashboard/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "jsonlite"))'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Render
        env:
          CBS_DASH_RDS: data/dashboard/dashtest_data.rds
        run: |
          quarto render index.qmd
          mkdir -p _site/data/dashboard && cp index.html _site/ && cp -r data/dashboard/geo _site/data/dashboard/ && touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
